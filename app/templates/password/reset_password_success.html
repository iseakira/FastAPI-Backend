<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>パスワードリセット完了</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      h1 {
        color: #2e7d32;
        font-size: 24px;
        margin-bottom: 12px;
      }
      p {
        color: #555555;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">✅</div>
      <h1>パスワードのリセットが完了しました</h1>
      <p>新しいパスワードが正常に設定されました。</p>
      <p>アプリに戻り、新しいパスワードでログインしてください。</p>
    </div>
  </body>
</html>
